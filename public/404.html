<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8">
    <title>در حال انتقال به سامانه سودوکو...</title>
    <script>
      // Single Page Application redirect script for GitHub Pages with HashRouter
      var pathSegmentsToKeep = 1;
      var l = window.location;
      var repoBase = l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/');
      var subPath = l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/');
      var targetHash = '#/' + (subPath ? subPath : '') + (l.search || '') + (l.hash || '');
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        repoBase + '/' + targetHash
      );
    </script>
  </head>
  <body style="background:#020617; color:#f8fafc; font-family:sans-serif; text-align:center; padding-top:50px; direction:rtl;">
