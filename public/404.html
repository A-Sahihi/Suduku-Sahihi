<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8">
    <title>در حال انتقال به سامانه سودوکو...</title>
    <script>
      // Single Page Application redirect script for GitHub Pages
      // Redirects 404 paths to index.html with query param
      var pathSegmentsToKeep = 1;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?p=/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body style="background:#020617; color:#f8fafc; font-family:sans-serif; text-align:center; padding-top:50px;">
    <p>در حال انتقال به سامانه سودوکو...</p>
    <a href="./" style="color:#f59e0b; text-decoration:none;">ورود به صفحه اصلی</a>
  </body>
</html>
